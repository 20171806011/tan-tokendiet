[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tan-tokendiet"
version = "1.0.0"
description = "Audit, benchmark, and compact MCP tool schemas & AI agent context files to cut LLM token burn and fix prompt-cache misses."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "TAN DevTools"}]
keywords = ["mcp", "llm", "tokens", "prompt-caching", "ai-agents", "finops", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
tokendiet = "tokendiet.cli:main"

[project.urls]
Homepage = "https://20171806011.github.io/tan-tokendiet/"
Repository = "https://github.com/20171806011/tan-tokendiet"
Issues = "https://github.com/20171806011/tan-tokendiet/issues"

[tool.setuptools.packages.find]
include = ["tokendiet*"]
